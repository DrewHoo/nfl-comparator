name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # Tuesday noon UTC, after Monday night: the scheduled build refetches the
  # nflverse files and rebuilds the ledger before building (a manual run does
  # too), so the week's games reach the site without a commit. A push builds
  # from the committed ledgers, so a code change never waits on a download.
  schedule:
    - cron: '0 12 * * 2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - if: github.event_name != 'push'
        run: npm run fetch && npm run ledger
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
